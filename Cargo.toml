[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/vault-core",
  "crates/vault-storage",
  "crates/vault-backup",
]

[workspace.package]
edition = "2021"
license = "LicenseRef-Proprietary"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
vault-core = { path = "crates/vault-core" }
vault-storage = { path = "crates/vault-storage" }
vault-backup = { path = "crates/vault-backup" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
